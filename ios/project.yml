name: UniversalIOCopilot

options:
  bundleIdPrefix: com.universalio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  UniversalIOCopilot:
    type: application
    platform: iOS
    sources:
      - path: UniversalIOCopilot
    info:
      path: UniversalIOCopilot/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription:
          Camera mode photographs the screen in front of you so it can be explained.
          Photos are sent for analysis and are not stored.
        # Required to reach a server on the same network — including a development
        # one on your Mac. Without this key iOS does not prompt and does not
        # explain: it fails the connection as if the device were offline.
        NSLocalNetworkUsageDescription:
          Screens are sent to the analysis server on your network. This is also how
          the app reaches a development server running on your Mac.
        # MultipeerConnectivity refuses to browse for a service that is not
        # declared here, and it does so silently: no prompt, no error, no peers
        # ever found. Both entries are required — the framework advertises over
        # TCP and UDP — and the name must match PeerLink.serviceType on both
        # sides exactly.
        NSBonjourServices:
          - _uio-mirror._tcp
          - _uio-mirror._udp
        # Permits plain HTTP to private addresses, which a local server uses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIODefaultAPIBaseURL: $(UIO_API_BASE_URL)
        UIOBetaToken: $(UIO_BETA_TOKEN)
    # Server URL and beta token come from here, so neither is committed.
    # Copy Local.xcconfig.example to Local.xcconfig before generating.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_MODULE_NAME: UniversalIOCopilot
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Set here rather than in the Xcode UI so regenerating the project does
        # not silently drop it and fail the next device build.
        #
        # The team is the certificate's OU field. Read it from there, because
        # the signing certificate carries three different identifiers and the
        # most visible one is not the team:
        #
        #   UID = A5GLW24AVM
        #   CN  = Apple Development: Kaya Matsumoto (48P276DZDB)
        #   OU  = TG68TFXG88   <- the team, and the only one that belongs here
        #
        # Using the number printed in the name fails with a missing-certificate
        # error that never mentions the team. Verify with:
        #   security find-certificate -c "Apple Development: <name>" -p \
        #     | openssl x509 -noout -subject
        #
        # ../../app-mac/project.yml documents the same trap but calls the name's
        # suffix a "certificate id"; the UID above shows that is not what it is.
        DEVELOPMENT_TEAM: TG68TFXG88
        CODE_SIGN_STYLE: Automatic
      configs:
        # Debug and Release carry different identities so a development build
        # never takes over the shipped app's registration or its granted
        # permissions. See docs/lessons-from-app-mac.md section 7.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.universalio.copilot.dev
          PRODUCT_NAME: Copilot Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.universalio.copilot
          PRODUCT_NAME: Copilot
