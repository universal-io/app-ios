name: UniversalIOCopilot

options:
  bundleIdPrefix: com.universalio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  UniversalIOCopilot:
    type: application
    platform: iOS
    sources:
      - path: UniversalIOCopilot
    info:
      path: UniversalIOCopilot/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription:
          Camera mode photographs the screen in front of you so it can be explained.
          Photos are sent for analysis and are not stored.
        # Lets the app reach a server running on the development machine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIODefaultAPIBaseURL: $(UIO_API_BASE_URL)
        UIOBetaToken: $(UIO_BETA_TOKEN)
    # Server URL and beta token come from here, so neither is committed.
    # Copy Local.xcconfig.example to Local.xcconfig before generating.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_MODULE_NAME: UniversalIOCopilot
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Debug and Release carry different identities so a development build
        # never takes over the shipped app's registration or its granted
        # permissions. See docs/lessons-from-app-mac.md section 7.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.universalio.copilot.dev
          PRODUCT_NAME: Copilot Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.universalio.copilot
          PRODUCT_NAME: Copilot
