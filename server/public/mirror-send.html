<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share this screen</title>

<!--
  The sending half of the "nothing installed" experiment. Open it on the machine
  whose screen is being explained, press the button, pick a screen. That is the
  whole install.

  It has to be opened as http://localhost:3000 rather than by IP: screen capture
  is only offered to a secure context, and localhost counts as one while a plain
  LAN address does not. The phone has no such requirement, because receiving
  needs nothing privileged.
-->

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    font: 15px/1.5 -apple-system, system-ui, sans-serif;
    background: #111; color: #eee;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lede { color: #999; margin: 0 0 20px; }
  fieldset { border: 1px solid #333; border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; }
  legend { color: #999; font-size: 13px; padding: 0 6px; }
  label { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  label span:first-child { width: 150px; color: #bbb; }
  input[type="text"], input[type="number"] { background: #1c1c1c; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; font: inherit; width: 220px; }
  input[type="range"] { width: 220px; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #2f6fed; color: #fff; cursor: pointer; }
  button.stop { background: #7a2020; }
  button:disabled { opacity: .5; cursor: default; }
  #stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; margin-top: 8px; }
  .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 6px 0; }
  .stat b { font-variant-numeric: tabular-nums; font-weight: 600; }
  #status { margin-top: 14px; color: #f87171; min-height: 1.5em; white-space: pre-wrap; }
  #sent { margin-top: 6px; color: #4ade80; font-variant-numeric: tabular-nums; }
  /* Kept on screen rather than hidden. A display:none video is not reliably
     decoded, so drawing from one can yield black frames or nothing at all —
     and it also removes the one glance that says whether capture is alive. */
  #preview { width: 260px; border: 1px solid #333; border-radius: 8px; margin-top: 16px; background: #000; }
</style>

<main>
  <h1>Share this screen</h1>
  <p class="lede">Nothing is installed. The browser captures the screen and the phone reads it.</p>

  <fieldset>
    <legend>Settings</legend>
    <label><span>Beta token</span><input id="token" type="text" value="dev-local-token"></label>
    <label><span>Frames per second</span><input id="fps" type="number" min="1" max="60" value="15"></label>
    <label><span>Longest edge (px)</span><input id="edge" type="number" min="480" max="3840" step="64" value="1600"></label>
    <label><span>JPEG quality</span><input id="quality" type="range" min="30" max="95" value="70"><b id="qualityValue">70</b></label>
  </fieldset>

  <button id="start">Share a screen</button>
  <button id="stop" class="stop" disabled>Stop</button>

  <div id="status"></div>
  <div id="sent"></div>
  <video id="preview" autoplay muted playsinline></video>

  <fieldset style="margin-top: 20px;">
    <legend>Measured</legend>
    <div id="stats">
      <div class="stat"><span>Sent</span><b id="mFps">—</b></div>
      <div class="stat"><span>Captured by browser</span><b id="mSourceFps">—</b></div>
      <div class="stat"><span>Frame size</span><b id="mBytes">—</b></div>
      <div class="stat"><span>Bandwidth</span><b id="mRate">—</b></div>
      <div class="stat"><span>JPEG encode</span><b id="mEncode">—</b></div>
      <div class="stat"><span>Upload round trip</span><b id="mUpload">—</b></div>
      <div class="stat"><span>Clock offset to server</span><b id="mOffset">—</b></div>
      <div class="stat"><span>Source size</span><b id="mSize">—</b></div>
    </div>
  </fieldset>
</main>

<canvas id="canvas" style="display:none"></canvas>

<script>
const el = (id) => document.getElementById(id);
const video = el("preview");

/**
 * Nothing here may fail quietly.
 *
 * The first version of this page reported "sharing" while sending nothing: the
 * browser's own indicator was on, the relay never received a frame, and the page
 * said neither. Every path that can throw now ends up on screen.
 */
function fail(where, error) {
  el("status").textContent = `${where}: ${error?.message ?? error}`;
  console.error(where, error);
}

window.addEventListener("unhandledrejection", (event) => fail("Unhandled", event.reason));
window.addEventListener("error", (event) => fail("Error", event.error ?? event.message));
const canvas = el("canvas");
const context = canvas.getContext("2d", { alpha: false });

let stream = null;
let running = false;
let clockOffset = 0;
let sentCount = 0;

// Rolling windows rather than totals: a number that averages over the whole
// session hides the thing you are trying to see, which is what it is doing now.
const recent = { sent: [], bytes: [], encode: [], upload: [] };

function note(list, value) {
  list.push(value);
  if (list.length > 30) list.shift();
}

const median = (list) => {
  if (list.length === 0) return null;
  const sorted = [...list].sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length / 2)];
};

/**
 * Maps this machine's clock onto the server's, so the phone can subtract two
 * timestamps taken on different devices and get a duration that means something.
 */
async function syncClock() {
  const samples = [];
  for (let i = 0; i < 5; i += 1) {
    const before = Date.now();
    const response = await fetch("/api/mirror/time", { cache: "no-store" });
    const after = Date.now();
    const { now } = await response.json();
    samples.push({ offset: now - (before + after) / 2, spread: after - before });
  }
  // The tightest round trip is the least distorted by a slow one.
  samples.sort((a, b) => a.spread - b.spread);
  clockOffset = samples[0].offset;
  el("mOffset").textContent = `${clockOffset >= 0 ? "+" : ""}${clockOffset.toFixed(0)} ms`;
}

async function start() {
  const status = el("status");
  status.textContent = "";

  if (!navigator.mediaDevices?.getDisplayMedia) {
    status.textContent = "This browser will not offer screen capture here. Open the page as http://localhost:3000/mirror-send.html — capture is only offered to a secure context.";
    return;
  }

  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: Number(el("fps").value) },
      audio: false,
    });
  } catch (error) {
    status.textContent = `Screen capture was refused: ${error.message}`;
    return;
  }

  video.srcObject = stream;
  // A rejected play() is what a screen that shares but never sends looks like,
  // so it is reported rather than allowed to abandon the rest of this function.
  try {
    await video.play();
  } catch (error) {
    fail("The captured stream would not play", error);
    stop();
    return;
  }

  // The browser stops the stream when the person presses the system's own
  // "stop sharing" button, and the loop has to notice rather than spin.
  stream.getVideoTracks()[0].addEventListener("ended", stop);

  try {
    await syncClock();
  } catch (error) {
    fail("Could not read the server clock", error);
    stop();
    return;
  }

  el("start").disabled = true;
  el("stop").disabled = false;
  running = true;
  loop().catch((error) => { fail("Sending stopped", error); stop(); });
}

function stop() {
  running = false;
  stream?.getTracks().forEach((track) => track.stop());
  stream = null;
  el("start").disabled = false;
  el("stop").disabled = true;
}

async function loop() {
  const token = el("token").value.trim();
  let lastFrameAt = 0;

  while (running) {
    const interval = 1000 / Math.max(1, Number(el("fps").value));
    const wait = Math.max(0, lastFrameAt + interval - performance.now());
    if (wait > 0) await new Promise((resolve) => setTimeout(resolve, wait));
    if (!running) break;
    lastFrameAt = performance.now();

    const width = video.videoWidth;
    const height = video.videoHeight;
    if (width === 0 || height === 0) {
      el("status").textContent = "The shared stream has no picture yet — waiting for the first frame.";
      continue;
    }

    const scale = Math.min(1, Number(el("edge").value) / Math.max(width, height));
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);

    const capturedAt = Date.now() + clockOffset;
    const encodeStart = performance.now();
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) =>
      canvas.toBlob(resolve, "image/jpeg", Number(el("quality").value) / 100),
    );
    note(recent.encode, performance.now() - encodeStart);
    if (!running) break;
    if (!blob) {
      el("status").textContent = "The browser produced no JPEG from the captured frame.";
      continue;
    }

    // One request in flight at a time. M4's clearest finding was that sending
    // faster than the far end accepts does not lose frames, it queues them, and
    // the delay grows without bound while every counter still looks healthy.
    const uploadStart = performance.now();
    try {
      const response = await fetch("/api/mirror/frame", {
        method: "POST",
        headers: {
          "Content-Type": "image/jpeg",
          "Authorization": `Bearer ${token}`,
          "x-captured-at": String(capturedAt),
        },
        body: blob,
      });
      if (!response.ok) {
        const detail = await response.text();
        el("status").textContent = `Server refused the frame: ${response.status} ${detail}`;
        if (response.status === 401) { stop(); return; }
        continue;
      }
    } catch (error) {
      el("status").textContent = `Could not reach the server: ${error.message}`;
      continue;
    }
    note(recent.upload, performance.now() - uploadStart);
    note(recent.bytes, blob.size);
    note(recent.sent, Date.now());

    sentCount += 1;
    el("status").textContent = "";
    el("sent").textContent = `${sentCount} frames accepted by the relay`;
    render(width, height);
  }
}

function render(sourceWidth, sourceHeight) {
  const times = recent.sent;
  const span = times.length > 1 ? (times[times.length - 1] - times[0]) / 1000 : 0;
  const fps = span > 0 ? (times.length - 1) / span : 0;
  const bytes = median(recent.bytes) ?? 0;

  el("mFps").textContent = `${fps.toFixed(1)} fps`;
  el("mBytes").textContent = `${(bytes / 1024).toFixed(0)} KB`;
  el("mRate").textContent = `${((bytes * 8 * fps) / 1e6).toFixed(2)} Mbps`;
  el("mEncode").textContent = `${(median(recent.encode) ?? 0).toFixed(0)} ms`;
  el("mUpload").textContent = `${(median(recent.upload) ?? 0).toFixed(0)} ms`;
  el("mSize").textContent = `${sourceWidth}×${sourceHeight} → ${canvas.width}×${canvas.height}`;

  const settings = stream?.getVideoTracks()[0]?.getSettings?.();
  if (settings?.frameRate) el("mSourceFps").textContent = `${settings.frameRate.toFixed(0)} fps`;
}

el("start").addEventListener("click", start);
el("stop").addEventListener("click", stop);
el("quality").addEventListener("input", (event) => {
  el("qualityValue").textContent = event.target.value;
});

const params = new URLSearchParams(location.search);
if (params.get("token")) el("token").value = params.get("token");
</script>
